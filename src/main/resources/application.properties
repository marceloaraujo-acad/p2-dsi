# Configuracao padrao. Qualquer chave pode ser sobrescrita, em ordem de prioridade, por:
#   1) -Dchave=valor (ex.: -Ddb.url=...)
#   2) variavel de ambiente: chave em MAIUSCULAS com '.' -> '_' (ex.: DB_URL, DB_PASSWORD)
# Nunca grave senhas reais neste arquivo - use variaveis de ambiente.

# --- Banco de dados ---------------------------------------------------
# H2 em arquivo (zero instalacao). AUTO_SERVER permite CLI e API ao mesmo tempo.
db.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
db.user=sa
db.password=
# Para MySQL (driver incluido com: mvn -Pmysql package):
#   DB_URL=jdbc:mysql://localhost:3306/dsi_usuarios?useSSL=false&serverTimezone=UTC
#   DB_USER=root   DB_PASSWORD=...   DB_SCHEMA=schema-mysql.sql
db.schema=schema.sql
# Carrega data.sql (usuarios de demonstracao) quando o schema e criado pela 1a vez.
db.seed=true
db.seed.script=data.sql

# --- Seguranca --------------------------------------------------------
security.pbkdf2.iterations=600000

# --- API REST ---------------------------------------------------------
# Escuta so em localhost por padrao (a API usa HTTP Basic: em producao, coloque atras de HTTPS).
server.host=127.0.0.1
server.port=8090
